ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autofix suggestions'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=100']

  - repo: local
    hooks:
      - id: vlmbench-lint
        name: vlmbench lint (configs/, benchmarks/)
        entry: python -m vlmbench.evals.lint
        language: python
        additional_dependencies: ["pydantic>=2.10", "pydantic-settings>=2.6", "pyyaml>=6"]
        files: ^(configs|benchmarks)/
        pass_filenames: false
