kind: Serve
extends: ../../configs/qwen3.5-9b.yaml
backend:
  args:  # appended: a 131K window (ExtractBench schemas run to 16K tokens at p90)
    - --max-model-len=131072
request:
  prompt: prompts/extract-json-v1.md
  pages_per_call: 2  # the gateway still cuts replies at 4,096 tokens: two dense pages fit
  max_tokens: 16384
  temperature: 0.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
    response_format:
      type: json_object
