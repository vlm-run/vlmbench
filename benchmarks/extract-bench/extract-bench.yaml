# Schema-guided JSON extraction from whole documents: ExtractBench (enterprise documents, 1 to 200+ pages) and
# LongArray-Extract (one array of up to 2,205 rows per document), each graded by its own published scorer.
kind: Eval
budget_usd: 10  # the most one run may spend, judges included; `--budget` overrides
serves:
  - qwen3.8-27b-api
  - qwen3.5-0.8b-api
  - gemma4-26b-api
  - diffusiongemma-26b-api
  - minimax-m3-api
  - qwen3.5-9b
  - gemma4-26b
datasets:
  extractbench:
    kind: extractbench
    revision: f9b910906cd7e73cc9eb5379a8d5d935c67b92c4
    samples: 10
    long_edge: 1600
  longarray:
    kind: longarray
    revision: f2ae30264ecd942fa0a9b9e787bb42e1e2577184
    samples: 10
    long_edge: 1600
  extractbench_pro:
    kind: extractbench_pro
    revision: 60b101709fe6e4c2925a494ef98e91f9ecbc300c
    samples: 10
    long_edge: 1600
  realdoc:
    kind: realdoc
    revision: 08dde9d20d844943fc328b161f9d332c7e8bdee4
    samples: 10
    long_edge: 1600
