kind: Serve
extends: ../../configs/gemma4-26b.yaml
backend:
  args:  # appended: vLLM keeps the last value, so a 32K window and up to 8 page images per request
    - --max-model-len=32768
    - '--limit-mm-per-prompt={"image": 8, "audio": 0}'
request:
  prompt: prompts/extract-json-v1.md
  pages_per_call: 2  # the gateway still cuts replies at 4,096 tokens: two dense pages fit
  max_tokens: 16384
  temperature: 0.0
  extra_body:
    response_format:
      type: json_object
