  - vlm-run-ocr-auto
  - gemini-3.5-flash-lite
  - gemini-3.7-flash
  - gemini-3.8-flash
  - gemini-4-argon
  - gemini-3.5-flash-lite-md-v2
  - gemini-3.7-flash-md-v2
