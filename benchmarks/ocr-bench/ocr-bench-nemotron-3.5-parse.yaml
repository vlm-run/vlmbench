# Nemotron's native mode: boxes + classes + text, rendered to markdown by NVIDIA's own postprocessor.
kind: Serve
extends: ../../configs/nemotron-3.5-parse.yaml
request:
  prompt: prompts/nemotron-native-v1.txt  # control tokens, not an instruction: a trailing newline breaks it
  max_tokens: 8744
  extra_body:
    temperature: 0.0
    top_k: 1
    repetition_penalty: 1.1
    skip_special_tokens: false
postprocess: vlmbench.evals.postprocess:nemotron
