# Qwen3.5-9B on one RTX 5090. One visual token per 32 x 32 px.
kind: Serve
model: Qwen/Qwen3.5-9B
weights: open
backend:
  type: vllm
  image: vllm/vllm-openai:v0.30.0
  env:
    HF_HUB_OFFLINE: "1"
  args:
    - --max-model-len=32768
    - --gpu-memory-utilization=0.85
    - --max-num-seqs=32
    - '--limit-mm-per-prompt={"image": 8, "video": 0}'
    - '--mm-processor-kwargs={"size": {"longest_edge": 4194304, "shortest_edge": 4096}}'
  gpu_hour_usd: 0.70
request:
  concurrency: 32
