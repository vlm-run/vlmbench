# DiffusionGemma 26B-A4B on one RTX 5090. v0.30.0 dies on its image requests (`_enable_mm_lora`): the v0.29.0
# image with that flag patched off. Its sampler's fp32 logits cap it at 8 sequences on 32 GB.
kind: Serve
model: nvidia/diffusiongemma-26B-A4B-it-NVFP4
weights: open
backend:
  type: vllm
  image: vllm-openai:v0.29.0-dg
  env:
    HF_HUB_OFFLINE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
  args:
    - --trust-remote-code
    - --attention-backend=TRITON_ATTN
    - --max-num-seqs=8
    - --max-model-len=16384
    - --gpu-memory-utilization=0.72
    - --kv-cache-dtype=fp8
    - '--limit-mm-per-prompt={"image": 1, "audio": 0}'
    - '--mm-processor-kwargs={"max_soft_tokens": 1120}'
    - --reasoning-parser=gemma4
    - '--override-generation-config={"max_new_tokens": null}'
  gpu_hour_usd: 0.70
request:
  concurrency: 8
